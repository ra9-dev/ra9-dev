<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Retro music player. Now playing: Rahul Agarwal, product engineer. Playlist of career tracks from 2016 to now, total 10 years 7 months.">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d4a"/><stop offset="0.5" stop-color="#2a2c36"/><stop offset="1" stop-color="#1e2028"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16304d"/><stop offset="1" stop-color="#1f4068"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2ee66b"/><stop offset="0.6" stop-color="#e8e23a"/><stop offset="1" stop-color="#ff4d3a"/>
    </linearGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" fill-opacity="0.35"/></pattern>
    <pattern id="grip" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#ffffff" fill-opacity="0.08"/></pattern>
    <clipPath id="marq"><rect x="40" y="128" width="500" height="34"/></clipPath>
    <filter id="glowG" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <style>
    .px { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .marquee { animation: marquee 16s linear infinite; }
    @keyframes marquee { from { transform: translateX(520px); } to { transform: translateX(-1220px); } }
    .b { transform-box: fill-box; transform-origin: bottom; animation: eq 0.9s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(0.12); } 100% { transform: scaleY(1); } }
    .seek { animation: seek 20s linear infinite; }
    @keyframes seek { from { transform: translateX(0); } to { transform: translateX(462px); } }
    .playing { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { fill-opacity: 0.55; } }
    .tri { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .knob { transform-box: fill-box; transform-origin: center; animation: slide 2.4s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateY(14px); } to { transform: translateY(-14px); } }
  </style>

  <rect width="1200" height="440" rx="18" fill="#0d1d31"/>

  <!-- ===== Main player window ===== -->
  <g transform="translate(20 20)">
    <rect width="560" height="400" rx="8" fill="url(#metal)" stroke="#000" stroke-opacity="0.6"/>
    <rect x="1" y="1" width="558" height="398" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- title bar -->
    <rect x="8" y="8" width="544" height="26" rx="4" fill="url(#titlebar)"/>
    <rect x="16" y="15" width="150" height="12" fill="url(#grip)"/>
    <text x="280" y="26" text-anchor="middle" class="px" font-size="13" font-weight="700" fill="#f2b84b" letter-spacing="4">RA9 · PLAYER</text>
    <rect x="394" y="15" width="110" height="12" fill="url(#grip)"/>
    <g fill="#c9d6e6"><rect x="514" y="14" width="10" height="14" rx="2" fill-opacity="0.25"/><rect x="530" y="14" width="10" height="14" rx="2" fill-opacity="0.25"/></g>

    <!-- LCD -->
    <rect x="16" y="46" width="528" height="200" rx="6" fill="#050807" stroke="#000"/>
    <g filter="url(#glowG)">
      <text x="34" y="98" class="px" font-size="46" font-weight="700" fill="#3cff6b" letter-spacing="2">10:07</text>
      <text x="214" y="74" class="px" font-size="12" fill="#3cff6b" fill-opacity="0.8">▶ PLAYING</text>
      <text x="214" y="96" class="px" font-size="12" fill="#3cff6b" fill-opacity="0.6">YRS:MOS</text>
      <text x="330" y="74" class="px" font-size="12" fill="#3cff6b" fill-opacity="0.8">320 kbps</text>
      <text x="330" y="96" class="px" font-size="12" fill="#3cff6b" fill-opacity="0.8">44 kHz  STEREO</text>
      <!-- marquee -->
      <g clip-path="url(#marq)">
        <text class="px marquee" x="40" y="152" font-size="20" font-weight="700" fill="#3cff6b" xml:space="preserve">*** RAHUL AGARWAL · PRODUCT ENGINEER &amp; TECH LEAD · NOW: FORWARD DEPLOYED @ RAPYD · KYB · AML · PYTHON · FASTAPI · AI-ASSISTED ***</text>
      </g>
    </g>
    <!-- spectrum analyser -->
    <g transform="translate(40 232)">
      <rect class="b" x="0"   y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.7s"/>
      <rect class="b" x="18"  y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:1.1s;animation-delay:-.3s"/>
      <rect class="b" x="36"  y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.8s;animation-delay:-.6s"/>
      <rect class="b" x="54"  y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:1.3s;animation-delay:-.2s"/>
      <rect class="b" x="72"  y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.6s;animation-delay:-.4s"/>
      <rect class="b" x="90"  y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:1s;animation-delay:-.8s"/>
      <rect class="b" x="108" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.75s;animation-delay:-.1s"/>
      <rect class="b" x="126" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:1.2s;animation-delay:-.5s"/>
      <rect class="b" x="144" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.9s;animation-delay:-.7s"/>
      <rect class="b" x="162" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.65s;animation-delay:-.35s"/>
      <rect class="b" x="180" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:1.15s;animation-delay:-.9s"/>
      <rect class="b" x="198" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.85s;animation-delay:-.15s"/>
      <rect class="b" x="216" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:1.05s;animation-delay:-.55s"/>
      <rect class="b" x="234" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.7s;animation-delay:-.25s"/>
      <rect class="b" x="252" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:.95s;animation-delay:-.65s"/>
      <rect class="b" x="270" y="-62" width="14" height="62" fill="url(#spec)" style="animation-duration:1.25s;animation-delay:-.45s"/>
      <rect width="290" height="62" y="-62" fill="url(#scan)"/>
    </g>
    <!-- mini EQ sliders -->
    <g transform="translate(360 182)">
      <g class="px" font-size="10" fill="#3cff6b" fill-opacity="0.6" text-anchor="middle"><text x="19" y="-6">PRODUCT</text><text x="67" y="-6">CODE</text><text x="109" y="-6">TEAM</text><text x="147" y="-6">AI</text></g>
      <g fill="#3cff6b" fill-opacity="0.25"><rect x="18" y="4" width="3" height="56"/><rect x="66" y="4" width="3" height="56"/><rect x="108" y="4" width="3" height="56"/><rect x="146" y="4" width="3" height="56"/></g>
      <g fill="#3cff6b">
        <rect class="knob" x="11" y="26" width="17" height="8" rx="1" style="animation-duration:2.2s"/>
        <rect class="knob" x="59" y="26" width="17" height="8" rx="1" style="animation-duration:1.7s;animation-delay:-.8s"/>
        <rect class="knob" x="101" y="26" width="17" height="8" rx="1" style="animation-duration:2.6s;animation-delay:-1.3s"/>
        <rect class="knob" x="139" y="26" width="17" height="8" rx="1" style="animation-duration:1.9s;animation-delay:-.4s"/>
      </g>
    </g>

    <!-- seek bar -->
    <rect x="16" y="262" width="528" height="12" rx="6" fill="#0b0d12" stroke="#000"/>
    <rect x="18" y="264" width="524" height="8" rx="4" fill="#3cff6b" fill-opacity="0.12"/>
    <rect class="seek" x="20" y="260" width="60" height="16" rx="3" fill="#c9d6e6"/>

    <!-- transport buttons -->
    <g transform="translate(16 292)">
      <g fill="#2f3240" stroke="#000" stroke-opacity="0.6">
        <rect width="62" height="40" rx="5"/><rect x="70" width="62" height="40" rx="5"/><rect x="140" width="62" height="40" rx="5" fill="#f2b84b"/><rect x="210" width="62" height="40" rx="5"/><rect x="280" width="62" height="40" rx="5"/>
      </g>
      <g fill="#c9d6e6">
        <path d="M22 12 v16 h3 v-16 z M25 20 l14 -8 v16 z"/>
        <path d="M92 12 l14 8 -14 8 z"/>
        <rect x="160" y="12" width="7" height="16" fill="#0f2238"/><rect x="175" y="12" width="7" height="16" fill="#0f2238"/>
        <rect x="233" y="12" width="16" height="16"/>
        <path d="M300 12 l14 8 -14 8 z M314 12 h3 v16 h-3 z"/>
      </g>
      <text x="364" y="25" class="px" font-size="12" fill="#8ea3bb">SHUFFLE  ·  REPEAT ∞</text>
    </g>
    <text x="280" y="378" text-anchor="middle" class="px" font-size="11" fill="#8ea3bb" letter-spacing="2">github.com/ra9-dev</text>
  </g>

  <!-- ===== Playlist window ===== -->
  <g transform="translate(600 20)">
    <rect width="580" height="400" rx="8" fill="url(#metal)" stroke="#000" stroke-opacity="0.6"/>
    <rect x="8" y="8" width="564" height="26" rx="4" fill="url(#titlebar)"/>
    <text x="290" y="26" text-anchor="middle" class="px" font-size="13" font-weight="700" fill="#f2b84b" letter-spacing="4">PLAYLIST · CAREER.M3U</text>
    <rect x="16" y="46" width="548" height="300" rx="6" fill="#050807" stroke="#000"/>

    <g class="px" font-size="15">
      <g fill="#3cff6b" fill-opacity="0.75">
        <text x="32" y="82">1. SVG Media · Software Developer</text><text x="548" y="82" text-anchor="end">1:08</text>
        <text x="32" y="122">2. Tyroo · Senior SDE</text><text x="548" y="122" text-anchor="end">1:10</text>
        <text x="32" y="162">3. Tyroo · Lead Software Engineer</text><text x="548" y="162" text-anchor="end">2:03</text>
        <text x="32" y="202">4. SAVii · SDE 3</text><text x="548" y="202" text-anchor="end">1:07</text>
        <text x="32" y="242">5. SAVii · Technical Lead</text><text x="548" y="242" text-anchor="end">1:06</text>
      </g>
      <rect class="playing" x="22" y="262" width="534" height="30" fill="#16304d" fill-opacity="1"/>
      <text x="32" y="282" fill="#ffffff" font-weight="700"><tspan class="tri" fill="#f2b84b">▶ </tspan>6. Rapyd · Lead Forward Deployed Eng.</text>
      <text x="548" y="282" text-anchor="end" fill="#f2b84b" font-weight="700">1:09</text>
      <text x="32" y="326" fill="#3cff6b" fill-opacity="0.4">7. ??? · Next track loading…</text><text x="548" y="326" text-anchor="end" fill="#3cff6b" fill-opacity="0.4">--:--</text>
    </g>

    <g class="px" font-size="12" fill="#8ea3bb">
      <text x="20" y="372">7 tracks · 10:07 total · YRS:MOS</text>
      <text x="560" y="372" text-anchor="end">+ ADD  − REM  ⇅ SORT</text>
    </g>
  </g>
</svg>
