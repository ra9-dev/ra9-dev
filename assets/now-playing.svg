<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Now playing: Rahul Agarwal, product engineer and tech lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1d31"/>
      <stop offset="0.55" stop-color="#16304d"/>
      <stop offset="1" stop-color="#1f4068"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2b84b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2b84b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1b1b1f"/>
      <stop offset="0.8" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="0.52" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .bar { transform-box: fill-box; transform-origin: bottom; animation: eq 1.1s ease-in-out infinite alternate; }
    @keyframes eq { 0% { transform: scaleY(0.18); } 100% { transform: scaleY(1); } }

    .role { opacity: 0; animation: role 12s infinite; }
    .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; } .r4 { animation-delay: 9s; }
    @keyframes role { 0% { opacity: 0; transform: translateY(8px); } 4%, 21% { opacity: 1; transform: translateY(0); } 25%, 100% { opacity: 0; transform: translateY(-8px); } }

    .progress { animation: prog 12s linear infinite; }
    @keyframes prog { from { width: 0; } to { width: 560px; } }
    .knob { animation: knob 12s linear infinite; }
    @keyframes knob { from { transform: translateX(0); } to { transform: translateX(560px); } }

    .live { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

    <!-- Vinyl record -->
    <g transform="translate(160 160)">
      <circle r="118" fill="#000" opacity="0.35" transform="translate(6 8)"/>
      <g class="spin">
        <circle r="118" fill="url(#vinyl)"/>
        <g fill="none" stroke="#ffffff" stroke-opacity="0.07">
          <circle r="108"/><circle r="99"/><circle r="90"/><circle r="81"/><circle r="72"/><circle r="63"/><circle r="54"/>
        </g>
        <circle r="118" fill="url(#sheen)"/>
        <circle r="42" fill="#f2b84b"/>
        <circle r="42" fill="none" stroke="#0f2238" stroke-width="2" stroke-opacity="0.35"/>
        <text x="0" y="9" text-anchor="middle" class="sans" font-size="25" font-weight="800" fill="#0f2238" letter-spacing="3">RA</text>
        <text x="0" y="-22" text-anchor="middle" class="mono" font-size="7" fill="#0f2238" letter-spacing="1.5">SIDE A</text>
        <circle r="4" fill="#0d1d31"/>
      </g>
    </g>

    <!-- Track info -->
    <g transform="translate(330 0)">
      <circle cx="6" cy="72" r="5" fill="#f2b84b" class="live"/>
      <text x="20" y="77" class="mono" font-size="15" fill="#f2b84b" letter-spacing="3">NOW PLAYING</text>

      <text x="0" y="134" class="sans" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">Rahul Agarwal</text>

      <g class="sans" font-size="24" font-weight="500" fill="#c9d6e6">
        <text x="0" y="176" class="role r1">Product Engineer · Tech Lead</text>
        <text x="0" y="176" class="role r2">Forward Deployed Engineer @ Rapyd</text>
        <text x="0" y="176" class="role r3">FinTech onboarding &amp; compliance (KYB · AML)</text>
        <text x="0" y="176" class="role r4">Python · FastAPI · AI-assisted engineering</text>
      </g>

      <!-- Progress bar -->
      <rect x="0" y="222" width="560" height="6" rx="3" fill="#ffffff" fill-opacity="0.14"/>
      <rect x="0" y="222" width="0" height="6" rx="3" fill="#f2b84b" class="progress"/>
      <circle cx="0" cy="225" r="8" fill="#ffffff" class="knob"/>
      <text x="0" y="256" class="mono" font-size="14" fill="#8ea3bb">2016</text>
      <text x="560" y="256" text-anchor="end" class="mono" font-size="14" fill="#8ea3bb">10+ yrs · on repeat</text>

      <!-- Controls -->
      <g transform="translate(232 284)" fill="#c9d6e6">
        <path d="M-56 -9 L-56 9 L-58 9 L-58 -9 Z M-56 0 L-44 -9 L-44 9 Z"/>
        <circle cx="0" cy="0" r="17" fill="#f2b84b"/>
        <rect x="-6" y="-7" width="4" height="14" rx="1" fill="#0f2238"/>
        <rect x="2" y="-7" width="4" height="14" rx="1" fill="#0f2238"/>
        <path d="M56 -9 L56 9 L58 9 L58 -9 Z M56 0 L44 -9 L44 9 Z"/>
      </g>
    </g>

    <!-- Equalizer -->
    <g transform="translate(985 250)" fill="#f2b84b">
      <rect class="bar" x="0"   y="-150" width="14" height="150" rx="4" style="animation-duration:0.9s"/>
      <rect class="bar" x="24"  y="-150" width="14" height="150" rx="4" style="animation-duration:1.3s;animation-delay:-0.4s" fill-opacity="0.85"/>
      <rect class="bar" x="48"  y="-150" width="14" height="150" rx="4" style="animation-duration:0.7s;animation-delay:-0.2s"/>
      <rect class="bar" x="72"  y="-150" width="14" height="150" rx="4" style="animation-duration:1.1s;animation-delay:-0.7s" fill-opacity="0.85"/>
      <rect class="bar" x="96"  y="-150" width="14" height="150" rx="4" style="animation-duration:0.8s;animation-delay:-0.5s"/>
      <rect class="bar" x="120" y="-150" width="14" height="150" rx="4" style="animation-duration:1.4s;animation-delay:-0.9s" fill-opacity="0.85"/>
      <rect class="bar" x="144" y="-150" width="14" height="150" rx="4" style="animation-duration:1s;animation-delay:-0.3s"/>
    </g>
    <text x="1065" y="282" text-anchor="middle" class="mono" font-size="12" fill="#8ea3bb" letter-spacing="2">ra9-dev</text>
  </g>
</svg>
