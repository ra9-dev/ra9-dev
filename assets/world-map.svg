.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.35);opacity:.2}}
.hop{animation:hop .7s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-10px)}}
.blink{animation:blink 1.1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
