<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="World map of my career. World 1: SVG Media and Tyroo, 2016 to 2022, Software Developer, Senior SDE, then Lead Software Engineer. World 2: SAVii, 2022 to 2025, SDE 3 then Technical Lead. World 3: Rapyd, 2025 to now, Lead Forward Deployed Engineer. Next level loading.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b0220"/><stop offset="1" stop-color="#2a0b52"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff3fd1"/></linearGradient>
<filter id="neon" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#c9a6ff" fill-opacity=".12"/></pattern></defs>
<style>.px{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700}
.trail{stroke-dasharray:14 10;animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.35);opacity:.2}}
.hop{animation:hop .7s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-10px)}}
.blink{animation:blink 1.1s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>
